services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEYS: "${LLM_API_KEYS:-}"
      LLM_MODEL: "${LLM_MODEL:-gemini/gemini-2.5-flash}"
      LLM_API_BASE: "${LLM_API_BASE:-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-18}"
      LLM_CACHE_TTL_SECONDS: "${LLM_CACHE_TTL_SECONDS:-600}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////data/app.db}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"
      ENABLE_FAILURE_SIMULATION: "${ENABLE_FAILURE_SIMULATION:-false}"
    volumes:
      - lantern_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      start_period: 20s
      retries: 4
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
    ports:
      - "3000:3000"
    restart: unless-stopped
volumes:
  lantern_data:
